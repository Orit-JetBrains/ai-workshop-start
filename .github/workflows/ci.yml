# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
  # Started by the Accept screenshots workflow, on the commit it pushed.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The demo's tests run in a browser, and record the run: Chromium, and the ffmpeg that writes
      # the videos. The run id names the directory they are kept in.
      - name: Install the browser
        run: npx playwright install --with-deps chromium ffmpeg
      - run: npm run typecheck
      - run: npm test
        env:
          DEMO_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # Every run of the demo's tests, passed or failed: the videos, the traces and the screenshots.
      - name: Keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
